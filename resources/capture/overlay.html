<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;cursor:crosshair;user-select:none}
    #screen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #shade{position:absolute;inset:0;background:rgba(0,0,0,.35);pointer-events:none}
    #selection{position:absolute;display:none;border:1px solid #89d486;box-shadow:0 0 0 100000px rgba(0,0,0,.35);pointer-events:none}
    #hint{position:absolute;top:24px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:8px;color:white;background:rgba(0,0,0,.75);font:14px system-ui;pointer-events:none}
  </style>
</head>
<body><img id="screen" alt=""><div id="shade"></div><div id="selection"></div><div id="hint">拖动选择截图区域 · Esc 取消</div><script src="overlay.js"></script></body>
</html>
