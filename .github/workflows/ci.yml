name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/windows-*']
  release:
    types: [published]

permissions:
  contents: read

# 普通 CI 取消同分支旧任务；Release 使用独立分组且不中断。
concurrency:
  group: ${{ github.event_name == 'release' && format('ci-release-{0}', github.event.release.id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Typecheck & Build
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # 项目要求 Node ≥ 22.6（README）；22.18+ 原生 strip-types 才能直接 node 跑 .ts 测试
          node-version: 22
          cache: npm

      - name: Verify release tag and package version
        if: github.event_name == 'release'
        run: node scripts/verify-windows-release.mjs --tag-only

      # better-sqlite3 原生模块在 postinstall 走 electron-rebuild，
      # Linux 下需要这些库（puppeteer/electron 依赖）
      - name: Install system deps for native build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ libgtk-3-0 libnss3 libasound2t64 || \
          sudo apt-get install -y python3 make g++ libgtk-3-0 libnss3 libasound2

      - name: Install dependencies
        run: npm ci

      # postinstall prepares better-sqlite3 for Electron. CI smoke tests run
      # under Node, so rebuild the native addon for the test runtime first.
      - name: Rebuild native test dependency for Node
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pure functions, no API)
        run: npm run test:unit

      - name: Build
        run: npm run build

  mac-regression:
    name: macOS regression
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag and package version
        if: github.event_name == 'release'
        run: node scripts/verify-windows-release.mjs --tag-only
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  windows:
    name: Windows x64 package
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows-runtime/package-lock.json
      - name: Verify release tag and package version
        if: github.event_name == 'release'
        run: node scripts/verify-windows-release.mjs --tag-only
      - name: Install dependencies
        run: npm ci
      - name: Prepare SQLite for Node tests
        run: npm rebuild better-sqlite3
      - name: Prepare native helper and offline OCR
        run: npm run prepare:win
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Restore SQLite for Electron packaging
        # npm rebuild above changes the binary without clearing electron-rebuild's marker.
        run: npm run postinstall
      - name: Build Windows application
        run: |
          npm run build
          node node_modules/electron-builder/cli.js --win --x64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged SQLite, UI and offline OCR
        run: npm run test:packaged:win
      - name: Build installers from verified application
        run: node node_modules/electron-builder/cli.js --win --x64 --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prepare platform-specific update manifest
        run: node scripts/create-windows-update-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: GuziAssistant-windows-x64
          if-no-files-found: error
          path: |
            release/GuziAssistant-*-win-x64.exe
            release/GuziAssistant-*-win-x64.zip
            release/latest-win-x64.json
            release/windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-package-diagnostics
          if-no-files-found: ignore
          path: release/windows-smoke.log

  publish-windows:
    name: Publish Windows release assets
    if: github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false
    needs: [build, mac-regression, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: GuziAssistant-windows-x64
          path: release
      - name: Read current release assets
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets > release-metadata.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Windows release assets and reject existing attachments
        run: node scripts/verify-windows-release.mjs
      - name: Upload verified Windows assets
        run: |
          version=$(node --print "require('./package.json').version")
          gh release upload "$RELEASE_TAG" \
            "release/GuziAssistant-${version}-win-x64.exe" \
            "release/GuziAssistant-${version}-win-x64.zip" \
            release/latest-win-x64.json \
            release/windows-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
