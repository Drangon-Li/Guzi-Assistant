name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/windows-*']

# 同一分支/PR 的旧任务自动取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 项目要求 Node ≥ 22.6（README）；22.18+ 原生 strip-types 才能直接 node 跑 .ts 测试
          node-version: 22
          cache: npm

      # better-sqlite3 原生模块在 postinstall 走 electron-rebuild，
      # Linux 下需要这些库（puppeteer/electron 依赖）
      - name: Install system deps for native build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ libgtk-3-0 libnss3 libasound2t64 || \
          sudo apt-get install -y python3 make g++ libgtk-3-0 libnss3 libasound2

      - name: Install dependencies
        run: npm ci

      # postinstall prepares better-sqlite3 for Electron. CI smoke tests run
      # under Node, so rebuild the native addon for the test runtime first.
      - name: Rebuild native test dependency for Node
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pure functions, no API)
        run: npm run test:unit

      - name: Build
        run: npm run build

  mac-regression:
    name: macOS regression
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  windows:
    name: Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows-runtime/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prepare SQLite for Node tests
        run: npm rebuild better-sqlite3
      - name: Prepare native helper and offline OCR
        run: npm run prepare:win
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Restore SQLite for Electron packaging
        # npm rebuild above changes the binary without clearing electron-rebuild's marker.
        run: npm run postinstall
      - name: Build Windows installers
        run: |
          npm run build
          node node_modules/electron-builder/cli.js --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged SQLite, UI and offline OCR
        run: npm run test:packaged:win
      - name: Prepare platform-specific update manifest
        run: node scripts/create-windows-update-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: GuziAssistant-windows-x64
          if-no-files-found: error
          path: |
            release/GuziAssistant-*-win-x64.exe
            release/GuziAssistant-*-win-x64.zip
            release/latest-win-x64.json
            release/windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-package-diagnostics
          if-no-files-found: ignore
          path: release/windows-smoke.log
