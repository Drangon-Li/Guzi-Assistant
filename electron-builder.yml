# 打包配置（macOS）：ad-hoc 签名的 dmg/zip，尚未进行 Apple 公证。
# 外部品牌统一使用中文；afterPack 会把 Electron helper 的内部路径恢复为 GuziAssistant。
# appId 暂保留旧值，维持 macOS 权限与升级身份连续性。
appId: cn.shilong.gooz
productName: 谷子助手
# GitHub 会截掉安装包文件名里的中文；应用内仍显示中文品牌。
artifactName: 'GuziAssistant-${version}-${arch}.${ext}'
afterPack: scripts/after-pack.cjs
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  # electron-vite 的 ?asset 导入在产物里解析为 join(__dirname,'../../resources/...')，
  # 即 app.asar/resources/**——源资源目录必须原样进包
  - resources/**
# 桌宠 preload（原始 .cjs，不进构建产物）：拷到 Contents/Resources/pet，petPreloadPath() 按 resourcesPath 解析
extraResources:
  - from: resources/pet
    to: pet
    filter: ['pet-preload.cjs', 'pet-mark.png']
asarUnpack:
  - '**/*.node' # better-sqlite3 原生模块不能从 asar 里加载
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.png
  # 暂无 Developer ID 证书；afterPack 在修改 bundle 后补全 ad-hoc 签名。
  identity: null
  extendInfo:
    # 主进程内部 Bundle/可执行文件保持 GuziAssistant，桌面和菜单显示中文品牌。
    CFBundleDisplayName: 谷子助手
    CFBundleName: GuziAssistant
    NSScreenCaptureUsageDescription: 谷子助手需要屏幕录制权限来识别屏幕上的日程与工作内容（截图仅在本机 OCR，默认只上传文字）。
    # 语音纪要要录麦克风；缺这条 macOS 会在首次 getUserMedia 时直接终止进程，而不是弹授权框
    NSMicrophoneUsageDescription: 谷子助手需要麦克风权限来记录会议内容并转成文字纪要（仅在你开启语音纪要时录制）。
npmRebuild: true
